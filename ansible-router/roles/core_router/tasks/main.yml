---
- name: Enable and start Core Router services
  raw: |
    for svc in dnsmasq odhcpd firewall; do
      /etc/init.d/$svc enabled || /etc/init.d/$svc enable
      /etc/init.d/$svc running || /etc/init.d/$svc start
    done
  changed_when: false

- name: Deploy Core Router Network, DHCP, and Firewall UCI Script
  include_tasks: "{{ playbook_dir }}/tasks/deploy_template.yml"
  vars:
    template_src: "uci_core.j2"
    dest_path: "/etc/ansible_uci/02_role.uci"
    file_mode: "0600"
    hide_log: true

- name: Apply Core Router UCI Script
  raw: |
    set -e
    for sec in defaults zone forwarding rule redirect; do
      while uci -q delete firewall.@${sec}[0]; do :; done
    done
    while uci -q delete dhcp.@host[0]; do :; done
    while uci -q delete dhcp.@domain[0]; do :; done
    uci batch < /etc/ansible_uci/02_role.uci
    uci commit network
    uci commit dhcp
    uci commit firewall
  when: _deploy_result.changed
  notify:
    - restart_network_safe
    - restart_dnsmasq
    - restart_odhcpd
