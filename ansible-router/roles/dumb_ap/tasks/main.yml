---
- name: Stop and disable built-in router services on Dumb AP
  raw: |
    for svc in dnsmasq odhcpd firewall; do
      if [ -x "/etc/init.d/$svc" ]; then
        /etc/init.d/$svc stop || true
        /etc/init.d/$svc disable || true
      fi
    done
  changed_when: false

- name: Deploy Dumb AP UCI Script
  include_tasks: "{{ playbook_dir }}/tasks/deploy_template.yml"
  vars:
    template_src: "uci_dumb_ap.j2"
    dest_path: "/etc/ansible_uci/10_20_dumb_ap.uci"
    file_mode: "0600"
    hide_log: true
