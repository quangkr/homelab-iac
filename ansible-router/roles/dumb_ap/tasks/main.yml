---
- name: Stop and disable router-only services on Dumb AP
  raw: |
    for svc in dnsmasq odhcpd firewall ddns smartdns; do
      if [ -x "/etc/init.d/$svc" ]; then
        /etc/init.d/$svc stop || true
        /etc/init.d/$svc disable || true
      fi
    done
  changed_when: false

- name: Deploy Dumb AP UCI Script
  raw: |
    cat << 'ANSIBLE_EOF' > /etc/ansible_uci/02_role.uci.tmp
    {{ lookup('template', 'uci_dumb_ap.j2') }}
    ANSIBLE_EOF
    chmod 600 /etc/ansible_uci/02_role.uci.tmp
    if [ ! -f /etc/ansible_uci/02_role.uci ] || ! cmp -s /etc/ansible_uci/02_role.uci.tmp /etc/ansible_uci/02_role.uci; then
      mv /etc/ansible_uci/02_role.uci.tmp /etc/ansible_uci/02_role.uci
      echo "CHANGED"
    else
      rm -f /etc/ansible_uci/02_role.uci.tmp
    fi
  register: uci_dumb_ap
  changed_when: "'CHANGED' in uci_dumb_ap.stdout"

- name: Apply Dumb AP UCI Script
  raw: "uci -q batch < /etc/ansible_uci/02_role.uci && uci commit network && uci commit dhcp"
  when: uci_dumb_ap.changed
  notify:
    - restart_network_safe
