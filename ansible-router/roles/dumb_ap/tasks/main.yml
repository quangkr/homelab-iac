---
- name: Stop and disable router-only services on Dumb AP
  raw: |
    for svc in dnsmasq odhcpd firewall ddns smartdns; do
      if [ -x "/etc/init.d/$svc" ]; then
        /etc/init.d/$svc stop || true
        /etc/init.d/$svc disable || true
      fi
    done
  changed_when: false

- name: Deploy Dumb AP UCI Script
  include_tasks: "{{ playbook_dir }}/tasks/deploy_template.yml"
  vars:
    template_src: "uci_dumb_ap.j2"
    dest_path: "/etc/ansible_uci/02_role.uci"
    file_mode: "0600"
    hide_log: true

- name: Apply Dumb AP UCI Script
  raw: |
    set -e
    while uci -q delete network.@wireguard_wg0[0]; do :; done
    uci batch < /etc/ansible_uci/02_role.uci
    uci commit network
    uci commit dhcp
  when: _deploy_result.changed
  notify:
    - restart_network_safe
