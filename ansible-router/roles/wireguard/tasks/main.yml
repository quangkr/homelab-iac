---
- name: Install WireGuard kernel module and tools (apk / opkg)
  raw: |
    PKGS="kmod-wireguard wireguard-tools"
    MISSING=""
    if command -v apk >/dev/null 2>&1; then
      for pkg in $PKGS; do
        apk info -e "$pkg" >/dev/null 2>&1 || MISSING="$MISSING $pkg"
      done
      if [ -n "$MISSING" ]; then
        apk update && apk add $MISSING
        echo "INSTALLED"
      fi
    else
      for pkg in $PKGS; do
        opkg status "$pkg" | grep -q "Status: install" || MISSING="$MISSING $pkg"
      done
      if [ -n "$MISSING" ]; then
        opkg update && opkg install $MISSING
        echo "INSTALLED"
      fi
    fi
  register: wg_pkg
  changed_when: "'INSTALLED' in wg_pkg.stdout"

- name: Ensure local wireguard_clients directory exists on control node
  delegate_to: localhost
  file:
    path: "{{ playbook_dir }}/wireguard_clients"
    state: directory
    mode: '0700'

- name: Render client WireGuard .conf files on control node
  delegate_to: localhost
  template:
    src: wg_client.conf.j2
    dest: "{{ playbook_dir }}/wireguard_clients/{{ item.name }}.conf"
    mode: '0600'
  loop: "{{ wireguard_peers }}"
  no_log: true

- name: Deploy WireGuard UCI Script
  raw: |
    cat << 'ANSIBLE_EOF' > /etc/ansible_uci/06_wireguard.uci.tmp
    {{ lookup('template', 'uci_wireguard.j2') }}
    ANSIBLE_EOF
    chmod 600 /etc/ansible_uci/06_wireguard.uci.tmp
    if [ ! -f /etc/ansible_uci/06_wireguard.uci ] || ! cmp -s /etc/ansible_uci/06_wireguard.uci.tmp /etc/ansible_uci/06_wireguard.uci; then
      mv /etc/ansible_uci/06_wireguard.uci.tmp /etc/ansible_uci/06_wireguard.uci
      echo "CHANGED"
    else
      rm -f /etc/ansible_uci/06_wireguard.uci.tmp
    fi
  register: uci_wg
  changed_when: "'CHANGED' in uci_wg.stdout"
  no_log: true

- name: Apply WireGuard UCI Script
  raw: |
    uci -q batch < /etc/ansible_uci/06_wireguard.uci
    uci commit network
    uci commit firewall
    /etc/init.d/firewall reload
    ifup wg0
  when: uci_wg.changed
