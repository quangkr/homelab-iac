---
- name: Install Cloudflare DDNS packages (apk / opkg)
  raw: |
    PKGS="ddns-scripts ddns-scripts-cloudflare curl ca-bundle"
    MISSING=""
    if command -v apk >/dev/null 2>&1; then
      for pkg in $PKGS; do
        apk info -e "$pkg" >/dev/null 2>&1 || MISSING="$MISSING $pkg"
      done
      if [ -n "$MISSING" ]; then
        apk update && apk add $MISSING
        echo "INSTALLED"
      fi
    else
      for pkg in $PKGS; do
        opkg status "$pkg" | grep -q "Status: install" || MISSING="$MISSING $pkg"
      done
      if [ -n "$MISSING" ]; then
        opkg update && opkg install $MISSING
        echo "INSTALLED"
      fi
    fi
  register: ddns_pkg
  changed_when: "'INSTALLED' in ddns_pkg.stdout"

- name: Deploy DDNS UCI Script
  include_tasks: "{{ playbook_dir }}/tasks/deploy_template.yml"
  vars:
    template_src: "uci_ddns.j2"
    dest_path: "/etc/ansible_uci/20_30_ddns.uci"
    file_mode: "0600"
    hide_log: true
