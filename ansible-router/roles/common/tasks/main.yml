---
- name: Stamp provisioned device role and preserve across sysupgrade
  raw: |
    set -e
    if [ ! -f /etc/ansible_device_role ] || [ "$(cat /etc/ansible_device_role)" != "{{ device_role }}" ]; then
      printf '%s\n' "{{ device_role }}" > /etc/ansible_device_role
      chmod 0644 /etc/ansible_device_role
      echo "STAMPED"
    fi
    touch /etc/sysupgrade.conf
    grep -qxF '/etc/ansible_device_role' /etc/sysupgrade.conf || echo '/etc/ansible_device_role' >> /etc/sysupgrade.conf
  register: _role_stamp
  changed_when: "'STAMPED' in _role_stamp.stdout"

- name: Disable conflicting pre-installed adblock services
  raw: |
    for svc in adblock adblock-fast simple-adblock; do
      if [ -x "/etc/init.d/$svc" ]; then
        /etc/init.d/$svc stop || true
        /etc/init.d/$svc disable || true
      fi
    done
  changed_when: false

- name: Deploy Common System & Bridge-VLAN UCI Script
  include_tasks: "{{ playbook_dir }}/tasks/deploy_template.yml"
  vars:
    template_src: "uci_common.j2"
    dest_path: "/etc/ansible_uci/10_10_common.uci"
    file_mode: "0600"
    hide_log: true
