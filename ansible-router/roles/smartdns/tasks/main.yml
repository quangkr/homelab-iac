---
- name: Install SmartDNS and HTTPS support packages (apk / opkg)
  raw: |
    PKGS="smartdns wget-ssl ca-bundle"
    MISSING=""
    if command -v apk >/dev/null 2>&1; then
      for pkg in $PKGS; do
        apk info -e "$pkg" >/dev/null 2>&1 || MISSING="$MISSING $pkg"
      done
      if [ -n "$MISSING" ]; then
        apk update && apk add $MISSING
        echo "INSTALLED"
      fi
    else
      for pkg in $PKGS; do
        opkg status "$pkg" | grep -q "Status: install" || MISSING="$MISSING $pkg"
      done
      if [ -n "$MISSING" ]; then
        opkg update && opkg install $MISSING
        echo "INSTALLED"
      fi
    fi
  register: smartdns_pkg
  changed_when: "'INSTALLED' in smartdns_pkg.stdout"

- name: Ensure SmartDNS blocklist directory exists
  raw: "mkdir -p /etc/smartdns/blocklists && chmod 755 /etc/smartdns/blocklists"
  changed_when: false

- name: Download missing SmartDNS blocklists
  raw: |
    {% for bl in smartdns_blocklists %}
    if [ ! -s /etc/smartdns/blocklists/{{ bl.name }}.conf ]; then
      wget -qO /etc/smartdns/blocklists/{{ bl.name }}.conf "{{ bl.url }}"
      echo "DOWNLOADED"
    fi
    {% endfor %}
  register: bl_dl
  changed_when: "'DOWNLOADED' in bl_dl.stdout"
  notify:
    - restart_smartdns

- name: Deploy SmartDNS custom rules (.lan forwarding & domain-sets)
  include_tasks: "{{ playbook_dir }}/tasks/deploy_template.yml"
  vars:
    template_src: "custom.conf.j2"
    dest_path: "/etc/smartdns/custom.conf"
    file_mode: "0644"
    hide_log: true

- name: Ensure weekly cron directory exists
  raw: "mkdir -p /etc/cron.weekly"
  changed_when: false

- name: Deploy weekly SmartDNS blocklist update script
  include_tasks: "{{ playbook_dir }}/tasks/deploy_template.yml"
  vars:
    template_src: "update_smartdns_blocklists.sh.j2"
    dest_path: "/etc/cron.weekly/update_smartdns_blocklists.sh"
    file_mode: "0755"
    hide_log: false

- name: Schedule weekly SmartDNS blocklist update in root crontab
  raw: |
    set -e
    mkdir -p /etc/crontabs
    touch /etc/crontabs/root
    if ! grep -q "update_smartdns_blocklists.sh" /etc/crontabs/root; then
      echo "0 4 * * 0 /etc/cron.weekly/update_smartdns_blocklists.sh" >> /etc/crontabs/root
    fi
    /etc/init.d/cron enabled || /etc/init.d/cron enable
    /etc/init.d/cron restart
  register: _cron_result
  changed_when: false

- name: Deploy SmartDNS UCI Script
  include_tasks: "{{ playbook_dir }}/tasks/deploy_template.yml"
  vars:
    template_src: "uci_smartdns.j2"
    dest_path: "/etc/ansible_uci/05_smartdns.uci"
    file_mode: "0600"
    hide_log: true

- name: Apply SmartDNS UCI Script
  raw: |
    set -e
    while uci -q delete smartdns.@smartdns[0]; do :; done
    while uci -q delete smartdns.@server[0]; do :; done
    uci batch < /etc/ansible_uci/05_smartdns.uci
    uci commit smartdns
    uci commit dhcp
    uci commit network
  when: _deploy_result.changed
  notify:
    - restart_dnsmasq
    - restart_odhcpd
    - restart_smartdns
    - restart_network_safe

- name: Enable and start SmartDNS service
  raw: |
    /etc/init.d/smartdns enabled || /etc/init.d/smartdns enable
    /etc/init.d/smartdns running || /etc/init.d/smartdns start
  changed_when: false
