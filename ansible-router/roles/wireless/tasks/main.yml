---
- name: Deploy Wireless UCI Script
  include_tasks: "{{ playbook_dir }}/tasks/deploy_template.yml"
  vars:
    template_src: "uci_wireless.j2"
    dest_path: "/etc/ansible_uci/03_wireless.uci"
    file_mode: "0600"
    hide_log: true

- name: Apply Wireless UCI Script
  raw: "uci -q batch < /etc/ansible_uci/03_wireless.uci && uci commit wireless"
  when: _deploy_result.changed
  notify:
    - reload_wifi
