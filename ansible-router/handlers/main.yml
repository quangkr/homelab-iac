---
- name: reload_system
  raw: "/etc/init.d/system reload"

- name: restart_dnsmasq
  raw: "/etc/init.d/dnsmasq restart"

- name: restart_odhcpd
  raw: "/etc/init.d/odhcpd restart"

- name: restart_smartdns
  raw: "/etc/init.d/smartdns restart"

- name: restart_ddns
  raw: "/etc/init.d/ddns restart"

- name: restart_network_safe
  raw: "/etc/init.d/network reload; /etc/init.d/firewall reload"

- name: reload_wifi
  raw: "/sbin/wifi reload"
