---
- name: reload_system
  raw: "/etc/init.d/system reload"

- name: restart_ddns
  raw: "/etc/init.d/ddns restart"

- name: restart_smartdns
  raw: "/etc/init.d/smartdns restart"

- name: restart_dnsmasq
  raw: "/etc/init.d/dnsmasq restart"

- name: restart_odhcpd
  raw: "/etc/init.d/odhcpd restart"

- name: restart_network_safe
  # Safe asynchronous cutover: backgrounds network + firewall + wireless reload after 2s
  # so Ansible cleanly closes the SSH channel before the router changes IP or bounces ports.
  raw: "setsid sh -c 'sleep 2; /etc/init.d/network reload; /etc/init.d/firewall reload' </dev/null >/dev/null 2>&1 &"

- name: reload_wifi
  raw: "setsid sh -c 'sleep 6; /etc/init.d/wifi reload' </dev/null >/dev/null 2>&1 &"
