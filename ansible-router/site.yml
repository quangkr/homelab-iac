---
# ==============================================================================
# SINGLE PLAY: Base Network, Wireless & Core Router Add-ons
# ==============================================================================
- name: Configure OpenWrt / ImmortalWrt Fleet
  hosts: all
  gather_facts: false

  pre_tasks:
    - name: Override ansible_host with bootstrap_ip for initial provisioning
      set_fact:
        ansible_host: "{{ bootstrap_ip }}"
      when: bootstrap_ip is defined

    - name: Ensure UCI fragments directory exists and clear stale fragments
      raw: |
        set -e
        mkdir -p /etc/ansible_uci
        chmod 0700 /etc/ansible_uci
        rm -f /etc/ansible_uci/*.uci
      changed_when: false

  tasks:
    # --------------------------------------------------------------------------
    # STAGE 1: Base System, Network, Firewall & Wireless (Built-in Packages)
    # --------------------------------------------------------------------------
    - include_role:
        name: common

    - include_role:
        name: core_router
      when: "'core_routers' in group_names"

    - include_role:
        name: dumb_ap
      when: "'dumb_aps' in group_names"

    - include_role:
        name: wireless

    # On first boot (or role switch), apply Stage 1 early ONLY if WAN is down
    # so PPPoE can establish internet before package installation.
    - name: Bootstrap base network early if WAN is not yet up
      raw: |
        set -e
        if ! ubus call network.interface.wan status 2>/dev/null | grep -q '"up": true'; then
          for f in $(ls /etc/ansible_uci/10_*.uci 2>/dev/null | sort); do
            uci -q batch < "$f"
          done
          for cfg in system network firewall dhcp wireless; do
            uci commit "$cfg" 2>/dev/null || true
          done
          (
            sleep 2
            /etc/init.d/network restart
            sleep 2
            /etc/init.d/dnsmasq restart
            /etc/init.d/odhcpd restart
            /etc/init.d/firewall restart
            /sbin/wifi reload
          ) >/dev/null 2>&1 &
          echo "BOOTSTRAPPED"
        fi
      register: _bootstrap_net
      changed_when: "'BOOTSTRAPPED' in _bootstrap_net.stdout"
      when: "'core_routers' in group_names"

    - name: Point ansible_host to the target role IP
      set_fact:
        ansible_host: "{{ '192.168.10.1' if 'core_routers' in group_names else '192.168.10.' ~ ap_ip_suffix }}"

    - name: Wait for router SSH after initial network bootstrap
      delegate_to: localhost
      wait_for:
        host: "{{ ansible_host }}"
        port: 22
        delay: 10
        sleep: 2
        timeout: 60
      when: _bootstrap_net is defined and _bootstrap_net.changed

    # --------------------------------------------------------------------------
    # STAGE 2: Core Router Add-ons (Fault-Tolerant if Offline / Feed Down)
    # --------------------------------------------------------------------------
    - name: Install and stage Core Router add-on packages
      when: "'core_routers' in group_names"
      block:
        - name: Wait for PPPoE WAN if add-on packages are not yet installed
          raw: |
            NEED_NET=0
            for pkg in kmod-wireguard wireguard-tools ddns-scripts ddns-scripts-cloudflare smartdns wget-ssl; do
              if command -v apk >/dev/null 2>&1; then
                apk info -e "$pkg" >/dev/null 2>&1 || NEED_NET=1
              else
                opkg status "$pkg" 2>/dev/null | grep -q "Status: install" || NEED_NET=1
              fi
            done
            [ "$NEED_NET" -eq 0 ] && exit 0

            for i in $(seq 1 20); do
              if ubus call network.interface.wan status 2>/dev/null | grep -q '"up": true'; then
                exit 0
              fi
              sleep 2
            done
            echo "WAN offline and packages missing" >&2
            exit 1
          changed_when: false

        - include_role:
            name: wireguard
        - include_role:
            name: ddns
        - include_role:
            name: smartdns

      rescue:
        - name: Remove partial Stage 2 fragments and fall back to 9.9.9.9 DNS
          raw: "rm -f /etc/ansible_uci/20_*.uci"
          changed_when: false

        - debug:
            msg: "WAN or package repo unavailable—continuing with base router config and 9.9.9.9 DNS fallback."

    # --------------------------------------------------------------------------
    # STAGE 3: Single Idempotent UCI Replay, Commit & Service Reload
    # --------------------------------------------------------------------------
    - name: Apply and commit all staged UCI fragments in a single pass
      raw: |
        set -e
        CONFIG_SECTIONS="system network firewall dhcp wireless ddns smartdns"
        for cfg in $CONFIG_SECTIONS; do
          eval "PRE_${cfg}=\$(md5sum /etc/config/${cfg} 2>/dev/null | awk '{print \$1}')"
        done

        # Reset dynamic/anonymous sections
        for sec in defaults zone forwarding rule redirect; do
          while uci -q delete firewall.@${sec}[0]; do :; done
        done
        while uci -q delete dhcp.@host[0]; do :; done
        while uci -q delete dhcp.@domain[0]; do :; done
        while uci -q delete wireless.@wifi-iface[0]; do :; done
        while uci -q delete ddns.@service[0]; do :; done

        if [ -s /etc/ansible_uci/10_20_dumb_ap.uci ]; then
          uci -q delete network.wg0 || true
          while uci -q delete network.@wireguard_wg0[0]; do :; done
        fi

        # Replay 10_*.uci followed by 20_*.uci before committing
        for f in $(ls /etc/ansible_uci/10_*.uci /etc/ansible_uci/20_*.uci 2>/dev/null | sort); do
          uci -q batch < "$f"
        done

        CHANGED=""
        for cfg in $CONFIG_SECTIONS; do
          uci commit "$cfg" 2>/dev/null || true
          PRE=$(eval "echo \$PRE_${cfg}")
          POST=$(md5sum /etc/config/${cfg} 2>/dev/null | awk '{print $1}')
          if [ "$PRE" != "$POST" ]; then
            CHANGED="$CHANGED $cfg"
          fi
        done
        echo "CHANGED_CONFIGS:$CHANGED"
      register: _uci_apply
      changed_when: "(_uci_apply.stdout | regex_search('^CHANGED_CONFIGS:\\s+\\S+', multiline=True)) is not none"

    - name: Restart changed services
      raw: |
        set -e
        CHANGED="{{ _uci_apply.stdout | regex_search('^CHANGED_CONFIGS:\\s+\\S+', multiline=True) | replace('CHANGED_CONFIGS:', '') }}"
        NEED_NET_RELOAD=0
        for cfg in $CHANGED; do
          case "$cfg" in
            system)   /etc/init.d/system reload ;;
            dhcp)     /etc/init.d/dnsmasq restart; /etc/init.d/odhcpd restart ;;
            smartdns) /etc/init.d/smartdns enable; /etc/init.d/smartdns restart ;;
            ddns)     /etc/init.d/ddns enable; /etc/init.d/ddns restart ;;
            firewall) /etc/init.d/firewall restart ;;
            network|wireless) NEED_NET_RELOAD=1 ;;
          esac
        done
        if [ "$NEED_NET_RELOAD" -eq 1 ]; then
          (
            sleep 2
            /etc/init.d/network restart
            sleep 2
            [ -x /etc/init.d/firewall ] && /etc/init.d/firewall enabled && /etc/init.d/firewall restart
            /sbin/wifi reload
          ) >/dev/null 2>&1 &
        fi
      when: _uci_apply.changed