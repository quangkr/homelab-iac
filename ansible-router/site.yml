---
# ==============================================================================
# PLAY 1: Base Network, VLANs, Firewall & Wireless (100% Built-in Packages)
# ==============================================================================
- name: Play 1 - Configure Base System & Networking
  hosts: all
  gather_facts: false
  roles:
    - role: common
    - role: core_router
      when: "'core_routers' in group_names"
    - role: dumb_ap
      when: "'dumb_aps' in group_names"
    - role: wireless

  post_tasks:
    - name: Flush network restart handlers before Play 2
      meta: flush_handlers

    - name: Point ansible_host to the target role IP after network cutover
      set_fact:
        ansible_host: "{{ '192.168.10.1' if 'core_routers' in group_names else '192.168.10.' ~ ap_ip_suffix }}"

    - name: Wait for router SSH to come back online after network cutover
      delegate_to: localhost
      wait_for:
        host: "{{ ansible_host }}"
        port: 22
        delay: 4
        timeout: 60

# ==============================================================================
# PLAY 2: Extra Services Requiring Internet / opkg (Core Routers Only)
# ==============================================================================
- name: Play 2 - Install & Configure Core Router Add-on Packages
  hosts: core_routers
  gather_facts: false
  pre_tasks:
    - name: Wait for PPPoE WAN interface to establish internet connectivity
      raw: |
        for i in $(seq 1 20); do
          if ubus call network.interface.wan status 2>/dev/null | grep -q '"up": true'; then
            exit 0
          fi
          sleep 2
        done
        echo "WAN interface did not come up within 40 seconds" >&2
        exit 1
      changed_when: false
  roles:
    - role: wireguard
    - role: ddns
    - role: smartdns
