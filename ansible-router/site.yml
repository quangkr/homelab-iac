---
# ==============================================================================
# SINGLE PLAY: Base Network, Wireless & Core Router Add-ons (Reset-Gated)
# ==============================================================================
- name: Configure OpenWrt / ImmortalWrt Fleet
  hosts: all
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../homelab-iac-private/ansible-router/group_vars/all/vault.yml"

  pre_tasks:
    - name: Validate exclusive inventory role membership
      assert:
        that:
          - "('core_routers' in group_names) != ('dumb_aps' in group_names)"
        fail_msg: >-
          Host '{{ inventory_hostname }}' must belong to exclusively one group:
          'core_routers' OR 'dumb_aps'.

    - name: Override ansible_host with bootstrap_ip for initial provisioning
      set_fact:
        ansible_host: "{{ bootstrap_ip }}"
      when: bootstrap_ip is defined

    - name: Enforce role-change reset gate and prepare UCI staging directory
      raw: |
        set -e
        if [ -f /etc/ansible_device_role ]; then
          CURRENT_ROLE=$(cat /etc/ansible_device_role)
          if [ "$CURRENT_ROLE" != "{{ device_role }}" ]; then
            echo "ROLE_MISMATCH: Device is currently provisioned as '$CURRENT_ROLE', but inventory defines '{{ device_role }}'." >&2
            echo "Run 'firstboot -y && reboot' on the device, re-add your SSH key at 192.168.1.1, and re-run with '-e bootstrap_ip=192.168.1.1'." >&2
            exit 1
          fi
        fi
        mkdir -p /etc/ansible_uci
        chmod 0700 /etc/ansible_uci
        rm -f /etc/ansible_uci/*.uci
      changed_when: false

  tasks:
    # --------------------------------------------------------------------------
    # STAGE 1: Base System, Network, Firewall & Wireless (Built-in Packages)
    # --------------------------------------------------------------------------
    - include_role:
        name: common

    - include_role:
        name: core_router
      when: "'core_routers' in group_names"

    - include_role:
        name: dumb_ap
      when: "'dumb_aps' in group_names"

    - include_role:
        name: wireless

    # Apply Stage 1 immediately ONLY during initial provisioning (bootstrap_ip)
    # so the device moves from 192.168.1.1 to VLAN 10 and dials PPPoE WAN
    # (for core_router only) before Stage 2 installs packages.
    - name: Bootstrap base network during initial provisioning
      raw: |
        set -e
        for sec in defaults zone forwarding rule redirect; do
          while uci -q delete firewall.@${sec}[0]; do :; done
        done
        while uci -q delete network.@device[0]; do :; done
        while uci -q delete network.@bridge-vlan[0]; do :; done
        while uci -q delete dhcp.@host[0]; do :; done
        while uci -q delete dhcp.@domain[0]; do :; done
        while uci -q delete wireless.@wifi-iface[0]; do :; done

        for f in $(ls /etc/ansible_uci/10_*.uci 2>/dev/null | sort); do
          uci -q batch < "$f"
        done
        for cfg in system network firewall dhcp wireless; do
          uci commit "$cfg" 2>/dev/null || true
        done

        (
          sleep 2
          /etc/init.d/network restart
          sleep 2
          if [ "{{ device_role }}" = "core_router" ]; then
            /etc/init.d/dnsmasq restart
            /etc/init.d/odhcpd restart
            /etc/init.d/firewall restart
          fi
          /sbin/wifi reload
        ) >/dev/null 2>&1 &
        echo "BOOTSTRAPPED"
      register: _bootstrap_net
      changed_when: "'BOOTSTRAPPED' in _bootstrap_net.stdout"
      when: bootstrap_ip is defined

    - name: Point ansible_host to the target VLAN 10 management IP
      set_fact:
        ansible_host: "{{ '192.168.10.1' if 'core_routers' in group_names else '192.168.10.' ~ ap_ip_suffix }}"

    - name: Wait for SSH on target VLAN 10 management IP after bootstrap
      delegate_to: localhost
      wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port | default(22) }}"
        delay: 8
        sleep: 2
        timeout: 60
      when: _bootstrap_net is defined and _bootstrap_net.changed

    # --------------------------------------------------------------------------
    # STAGE 2: Core Router Add-ons (Fault-Tolerant if Offline / Feed Down)
    # --------------------------------------------------------------------------
    - name: Install and stage Core Router add-on packages
      when: "'core_routers' in group_names"
      block:
        - name: Wait for PPPoE WAN if add-on packages are not yet installed
          raw: |
            NEED_NET=0
            for pkg in kmod-wireguard wireguard-tools ddns-scripts ddns-scripts-cloudflare curl smartdns wget-ssl ca-bundle; do
              if command -v apk >/dev/null 2>&1; then
                apk info -e "$pkg" >/dev/null 2>&1 || NEED_NET=1
              else
                opkg status "$pkg" 2>/dev/null | grep -q "Status: install" || NEED_NET=1
              fi
            done
            [ "$NEED_NET" -eq 0 ] && exit 0
            for i in $(seq 1 20); do
              if ubus call network.interface.wan status 2>/dev/null | grep -q '"up": true'; then
                exit 0
              fi
              sleep 2
            done
            echo "WAN offline and packages missing" >&2
            exit 1
          changed_when: false

        - include_role:
            name: wireguard

        - include_role:
            name: ddns

        - include_role:
            name: smartdns

      rescue:
        - name: Remove partial Stage 2 fragments and fall back to 9.9.9.9 DNS
          raw: "rm -f /etc/ansible_uci/20_*.uci"
          changed_when: false

        - debug:
            msg: "WAN or package repo unavailable; continuing with base router config and 9.9.9.9 DNS fallback."

    # --------------------------------------------------------------------------
    # STAGE 3: Single Idempotent UCI Replay, Commit & Selective Service Reload
    # --------------------------------------------------------------------------
    - name: Apply and commit all staged UCI fragments in a single pass
      raw: |
        set -e
        CONFIG_SECTIONS="system network firewall dhcp wireless ddns smartdns"
        for cfg in $CONFIG_SECTIONS; do
          eval "PRE_${cfg}=\$(md5sum /etc/config/${cfg} 2>/dev/null | awk '{print \$1}')"
        done

        # Reset dynamic/anonymous sections before deterministic replay
        for sec in defaults zone forwarding rule redirect; do
          while uci -q delete firewall.@${sec}[0]; do :; done
        done
        while uci -q delete network.@device[0]; do :; done
        while uci -q delete network.@bridge-vlan[0]; do :; done
        while uci -q delete dhcp.@host[0]; do :; done
        while uci -q delete dhcp.@domain[0]; do :; done
        while uci -q delete wireless.@wifi-iface[0]; do :; done
        while uci -q delete ddns.@service[0]; do :; done

        # Replay Stage 1 (10_*.uci) followed by Stage 2 (20_*.uci)
        for f in $(ls /etc/ansible_uci/10_*.uci /etc/ansible_uci/20_*.uci 2>/dev/null | sort); do
          uci -q batch < "$f"
        done

        CHANGED=""
        for cfg in $CONFIG_SECTIONS; do
          uci commit "$cfg" 2>/dev/null || true
          PRE=$(eval "echo \$PRE_${cfg}")
          POST=$(md5sum /etc/config/${cfg} 2>/dev/null | awk '{print $1}')
          if [ "$PRE" != "$POST" ]; then
            CHANGED="$CHANGED $cfg"
          fi
        done
        echo "CHANGED_CONFIGS:$CHANGED"
      register: _uci_apply
      changed_when: "(_uci_apply.stdout | regex_search('^CHANGED_CONFIGS:\\s+\\S+', multiline=True)) is not none"

    - name: Restart changed services
      raw: |
        set -e
        CHANGED="{{ _uci_apply.stdout | regex_search('^CHANGED_CONFIGS:\\s+\\S+', multiline=True) | replace('CHANGED_CONFIGS:', '') }}"
        NEED_NET_RELOAD=0
        for cfg in $CHANGED; do
          case "$cfg" in
            system)   /etc/init.d/system reload ;;
            dhcp)     [ "{{ device_role }}" = "core_router" ] && { /etc/init.d/dnsmasq restart; /etc/init.d/odhcpd restart; } ;;
            smartdns) /etc/init.d/smartdns enable; /etc/init.d/smartdns restart ;;
            ddns)     /etc/init.d/ddns enable; /etc/init.d/ddns restart ;;
            firewall) [ "{{ device_role }}" = "core_router" ] && /etc/init.d/firewall restart ;;
            network|wireless) NEED_NET_RELOAD=1 ;;
          esac
        done
        if [ "$NEED_NET_RELOAD" -eq 1 ]; then
          (
            sleep 2
            /etc/init.d/network restart
            sleep 2
            [ -x /etc/init.d/firewall ] && /etc/init.d/firewall enabled && /etc/init.d/firewall restart
            /sbin/wifi reload
          ) >/dev/null 2>&1 &
          echo "NET_RELOADED"
        fi
      register: _svc_restart
      when: _uci_apply.changed

    - name: Wait for SSH after asynchronous network/wireless reload
      delegate_to: localhost
      wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port | default(22) }}"
        delay: 5
        sleep: 2
        timeout: 45
      when: _svc_restart is defined and _svc_restart.stdout is defined and 'NET_RELOADED' in _svc_restart.stdout
