# Port Forwards Fixture (IPv4 DNAT)
port_forwards:
  - name: "Lab_HTTP"
    proto: "tcp"
    src_dport: 80
    dest_zone: "lab"
    dest_ip: "192.168.20.2"
  - name: "Lab_HTTPS"
    proto: "tcp"
    src_dport: 443
    dest_zone: "lab"
    dest_ip: "192.168.20.2"
    dest_port: 443

# IPv6 Inbound Traffic Rules Fixture
ipv6_inbound_rules:
  - name: "Lab_HTTP_v6"
    proto: "tcp"
    dest_zone: "lab"
    dest_ip: "::10/-64"
    dest_port: "80"
  - name: "Lab_HTTPS_v6"
    proto: "tcp"
    dest_zone: "lab"
    dest_ip: "::10/-64"
    dest_port: "443"

# Cloudflare DDNS Domains Fixture (matches mock_isp.py mock API)
ddns_domains:
