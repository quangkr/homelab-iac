---
- name: "Stream {{ dest_path }} to router over SSH stdin"
  delegate_to: localhost
  command:
    argv: "{{ ['ssh', '-o', 'ControlMaster=no', '-o', 'StrictHostKeyChecking=no', '-o', 'UserKnownHostsFile=/dev/null']
              + (ansible_ssh_common_args.split() if ansible_ssh_common_args is defined and ansible_ssh_common_args else [])
              + (['-i', ansible_ssh_private_key_file] if ansible_ssh_private_key_file is defined and ansible_ssh_private_key_file else [])
              + ['-p', (ansible_port | default(22)) | string, ansible_user ~ '@' ~ ansible_host, 'cat > ' ~ dest_path ~ '.tmp'] }}"
    stdin: "{{ lookup('template', template_src) }}"
    stdin_add_newline: false
  changed_when: false
  no_log: "{{ hide_log | default(false) }}"

- name: "Verify and apply {{ dest_path }}"
  raw: |
    set -e
    if [ ! -s {{ dest_path }}.tmp ]; then
      echo "ERROR: Streamed file {{ dest_path }}.tmp is empty" >&2
      rm -f {{ dest_path }}.tmp
      exit 1
    fi
    chmod {{ file_mode | default('0600') }} {{ dest_path }}.tmp
    if [ ! -f {{ dest_path }} ] || ! cmp -s {{ dest_path }}.tmp {{ dest_path }}; then
      mv {{ dest_path }}.tmp {{ dest_path }}
      echo "CHANGED"
    else
      rm -f {{ dest_path }}.tmp
    fi
  register: _deploy_result
  changed_when: "'CHANGED' in _deploy_result.stdout"
  no_log: "{{ hide_log | default(false) }}"
